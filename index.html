<style>
@font-face{font-family:Vazirmatn;src:url(fonts/Vazirmatn-Regular.woff2) format('woff2');font-weight:400}
@font-face{font-family:Vazirmatn;src:url(fonts/Vazirmatn-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:Vazirmatn;src:url(fonts/Vazirmatn-Bold.woff2) format('woff2');font-weight:600 900}
/* درس‌یار v5 — 3 tabs, single-scroll course page, everything secondary lives in bottom sheets */
:root{--bg:#F4F6F3;--card:#FFFFFF;--ink:#111613;--muted:#646E66;--line:#E1E7E2;--soft:#ECF1ED;
  --green:#22C55E;--green-ink:#15803D;--nav:#121614;--nav-ink:#98A39A;--amber:#F5A524;--amber-ink:#8A5300;--bad:#E5484D;
  --ease:cubic-bezier(.23,1,.32,1);color-scheme:light}
:root[data-theme=dark]{--bg:#0B0D0C;--card:#151917;--ink:#EEF3EF;--muted:#8F9892;--line:#252C28;--soft:#1C221F;
  --green-ink:#4ADE80;--nav:#1C221F;--nav-ink:#7D877F;--amber-ink:#F5A524;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;text-align:inherit;padding:0}
input,textarea,select{font:inherit;font-size:16px;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;max-width:620px;margin:0 auto;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top)) 20px calc(120px + env(safe-area-inset-bottom));scrollbar-width:none;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}
.fade{animation:fade .22s var(--ease)}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.press{transition:transform .14s var(--ease)}.press:active{transform:scale(.97)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px}.logo svg{width:30px;height:30px}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ibtn svg{width:20px;height:20px}.ibtn.dim{opacity:.55}
.ibtn .n{position:absolute;top:-4px;left:-4px;box-shadow:0 0 0 2px var(--bg);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.hi{font-size:14px;color:var(--muted);margin:0}
h1{font-size:27px;line-height:1.4;margin:2px 0 18px;font-weight:900;text-wrap:balance}
h1 em{font-style:normal;color:var(--green-ink)}
h2{font-size:16px;margin:24px 0 10px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{font-size:12.5px;color:var(--muted);font-weight:500;flex:1}
.add{height:34px;padding:0 12px;border-radius:11px;background:var(--soft);font-size:12.5px;font-weight:800;color:var(--green-ink);white-space:nowrap}
.next{position:relative;display:block;width:100%;overflow:hidden;border-radius:26px;padding:20px;color:#fff;background:var(--c);background:color-mix(in srgb,var(--c) 78%,#06140C)}
.next .k{font-size:12.5px;opacity:.88}.next .t{font-size:22px;font-weight:900;margin:4px 0 10px;line-height:1.35;padding-left:90px}
.next .r{display:flex;gap:14px;font-size:13.5px;flex-wrap:wrap}
.next .chip{position:absolute;left:16px;top:16px;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.next .motif{position:absolute;left:-6px;bottom:-8px;width:150px;height:90px;opacity:.3;stroke:#fff}
.list{background:var(--card);border-radius:22px;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid var(--line);width:100%}
.row:first-child{border-top:0}
.row .tx{flex:1;min-width:0}.row b{font-size:14.5px;display:block;overflow-wrap:anywhere}.row .m{font-size:12.5px;color:var(--muted)}
.row .end{color:var(--muted);font-size:12.5px;white-space:nowrap}.row .end.late{color:var(--bad);font-weight:700}
.chk{width:44px;height:44px;margin:0 -9px;display:grid;place-items:center;flex:none}
.chk i{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk svg{width:14px;height:14px;stroke:#fff;opacity:0}
.done .chk i{background:var(--green);border-color:var(--green)}.done .chk svg{opacity:1}
.done b{text-decoration:line-through;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--c);margin-left:5px}
.sug{display:flex;gap:12px;background:var(--card);border-radius:22px;padding:16px;width:100%}
.sug .ic{width:40px;height:40px;border-radius:13px;background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber-ink);display:grid;place-items:center;flex:none;font-weight:900}
.sug p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.7}
.cd{display:block;width:100%;background:var(--card);border-radius:22px;padding:18px}
.cd .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cd .hd b{font-size:14.5px}.cd .hd span{font-size:28px;font-weight:900;color:var(--k,var(--green-ink));font-variant-numeric:tabular-nums;white-space:nowrap}
.cd .hd span small{font-size:13px;color:var(--muted);font-weight:500;margin-right:4px}
.dots{display:grid;grid-template-columns:repeat(22,1fr);gap:4px;margin-top:12px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--line)}.dots i.on{background:var(--k,var(--green))}
.empty{text-align:center;color:var(--muted);padding:26px 14px;font-size:14px;background:var(--card);border-radius:22px;line-height:1.8}
.hero{background:var(--card);border-radius:26px;padding:22px;text-align:center}
.hero .big{font-size:22px;font-weight:900;margin:10px 0 6px}.hero p{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.8}
.nav{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));height:68px;background:var(--nav);border-radius:24px;display:grid;grid-template-columns:repeat(3,1fr);padding:0 6px;z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--nav-ink);font-size:12px;font-weight:700}
.nav button svg{width:22px;height:22px}.nav button.on{color:var(--green)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;min-height:40px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted);text-align:center}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on.bad{color:var(--bad)}
.week{background:var(--card);border-radius:22px;padding:12px 8px 12px 10px}
.wk-h,.wk-b{display:grid;grid-template-columns:30px repeat(7,1fr)}
.wk-h{font-size:11px;color:var(--muted);text-align:center;font-weight:700;margin-bottom:6px}.wk-h .td{color:var(--green-ink)}
.wk-b .tl{font-size:10px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.wk-b .col{position:relative;border-right:1px dashed var(--line)}
.wk-b .col.td{background:color-mix(in srgb,var(--green) 7%,transparent);border-radius:8px}
.blk{position:absolute;left:2px;right:2px;border-radius:8px;padding:4px 3px;font-size:9.5px;font-weight:800;line-height:1.3;background:color-mix(in srgb,var(--c) 22%,var(--card));border-right:3px solid var(--c);overflow:hidden}
.blk span{display:block;font-weight:500;color:var(--muted);font-size:9px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:14px}
.strip button{padding:6px 0;border-radius:14px;min-height:56px;text-align:center}
.strip small{display:block;font-size:11.5px;color:var(--muted)}.strip b{font-size:18px}
.strip button.on{background:var(--ink);color:var(--bg)}.strip button.on small{color:inherit;opacity:.7}
.strip button.td:not(.on) b{color:var(--green-ink)}
.tline{display:grid;grid-template-columns:54px 1fr;gap:10px}
.tline .tm{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;padding-top:14px}.tline .tm span{display:block;color:var(--muted);font-weight:500;font-size:12px}
.tcard{display:block;width:100%;border-radius:20px;padding:14px 16px;background:color-mix(in srgb,var(--c) 14%,var(--card));margin-bottom:10px;border-right:4px solid var(--c)}
.tcard b{font-size:15px}.tcard p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.tcard.off{opacity:.55}.tcard.off b{text-decoration:line-through}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mhead b{font-size:17px}.mhead button{width:44px;height:44px;border-radius:14px;background:var(--card);font-size:18px;text-align:center}
.month{background:var(--card);border-radius:22px;padding:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.month .h{font-size:11px;color:var(--muted);padding:4px 0;font-weight:700}
.month button{min-height:48px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;font-variant-numeric:tabular-nums;text-align:center}
.month button.today{background:var(--soft);font-weight:900;color:var(--green-ink)}
.month button.sel{background:var(--ink);color:var(--bg)}
.month button.hol{color:var(--muted);text-decoration:line-through}
.month button.fri{color:var(--bad)}.month button.sel.fri{color:var(--bg)}
.md{display:flex;gap:2px;height:5px}.md i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.daybar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}.daybar b{font-size:15px}
.ccard{position:relative;display:block;width:100%;background:var(--card);border-radius:24px;padding:16px 18px;margin-bottom:12px;overflow:hidden;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
.ccard b{font-size:16px;display:block;padding-left:60px;overflow-wrap:anywhere}
.ccard .s{font-size:12.5px;color:var(--muted);margin-top:4px;display:block;padding-left:60px}
.ccard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:5px 11px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.urg{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber-ink)}
.ring{position:absolute;left:16px;top:14px;width:50px;height:50px}.ring svg{transform:scaleX(-1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;padding:0!important;font-weight:800}
.ccard .motif{width:90px;height:44px;stroke:var(--c);opacity:.65;flex:none}
.fab{position:absolute;left:20px;bottom:calc(96px + env(safe-area-inset-bottom));height:52px;padding:0 20px;border-radius:18px;background:var(--green);color:#04210F;font-weight:800;display:flex;align-items:center;gap:6px;z-index:6;box-shadow:0 10px 24px rgba(34,197,94,.35)}
.cp-top{display:flex;justify-content:space-between;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;background:var(--card);font-weight:700;font-size:13.5px}
.cp-title{display:flex;gap:14px;align-items:center;margin:16px 0 4px}
.tile{width:56px;height:56px;border-radius:18px;background:color-mix(in srgb,var(--c) 18%,var(--card));display:grid;place-items:center;flex:none}
.tile svg{width:44px;height:30px;stroke:var(--c)}
.cp-title h1{margin:0;font-size:24px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:13.5px;margin:6px 0 16px;line-height:1.7}
.exr{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.exr button{flex:none;background:var(--soft);border-radius:14px;padding:8px 12px;font-size:12.5px;min-height:44px}
.exr button b{display:block;font-size:13px}
.prog{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin:4px 0}
.prog i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .3s var(--ease)}
.att{display:flex;gap:8px;flex-wrap:wrap}
.att button{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:800;text-align:center;background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green-ink)}
.att button.ab{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.att button.off{background:var(--soft);color:var(--muted);text-decoration:line-through}
.att button.up{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.srch{width:100%;height:44px;border-radius:14px;border:0;background:var(--soft);padding:0 14px;margin-bottom:8px}
.grp{font-size:12px;color:var(--muted);font-weight:700;padding:10px 0 2px}
.fi{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:10px;font-weight:900;color:var(--green-ink);flex:none}
.x{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);font-size:20px;flex:none;text-align:center}
.notebox{display:block;width:100%;background:var(--card);border-radius:22px;padding:14px 16px;font-size:14px;line-height:1.8;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.prof{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:14px 16px;width:100%}
.prof .av{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:900;color:var(--muted);flex:none}
.cta{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:6}
.cta .main{flex:1;height:58px;border-radius:20px;background:var(--nav);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.cta .main i{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-style:normal}
.cta .sq{width:58px;height:58px;border-radius:20px;background:var(--nav);color:#fff;display:grid;place-items:center}
.scrim{position:absolute;inset:0;background:rgba(5,10,8,.42);z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,0,1);max-height:90%;overflow-y:auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.handle{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0 0 6px;font-size:19px;font-weight:900}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 6px;line-height:1.8}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 8px;font-weight:600}
.in{width:100%;min-height:50px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;color:var(--ink)}
.in:focus{outline:none;border-color:var(--green)}
textarea.in{height:96px;padding:12px 14px;resize:none;line-height:1.7}
.ltr{direction:ltr;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:42px;padding:0 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:13.5px}
.chips button.on{background:var(--green);border-color:var(--green);color:#04210F}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;min-height:54px;border-radius:18px;background:var(--green);color:#04210F;font-weight:900;font-size:16px;margin-top:18px;text-align:center}
.btn.ghost{background:var(--soft);color:var(--ink)}.btn.danger{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.btn.sm{min-height:46px;font-size:14.5px;margin-top:10px}
.more{margin-top:10px;color:var(--green-ink);font-weight:700;font-size:14px;min-height:44px}
.mini{background:var(--card);border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:13px}
.mini .h{font-size:11px;color:var(--muted);padding:4px 0}
.mini .mh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:0 2px 6px}
.mini .mh button{width:40px;height:36px;border-radius:10px;background:var(--soft)}
.mini button.d{height:38px;border-radius:10px;font-variant-numeric:tabular-nums;text-align:center}
.mini button.d.on{background:var(--green);color:#04210F;font-weight:800}
.mini button.d.ex{box-shadow:inset 0 0 0 1.5px var(--amber)}
.mini button.d.td{color:var(--green-ink);font-weight:800}
.alertrow{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;width:100%}
.alertrow .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:900;flex:none}
.alertrow p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.7}
.icongrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.icongrid button{height:52px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center}
.icongrid button.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--card))}
.icongrid svg{width:38px;height:24px;stroke:var(--ink)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;background:var(--c)}.sw button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.autoicon{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px;margin-top:10px;font-size:13px;color:var(--muted)}
.autoicon .tile{width:46px;height:46px;border-radius:14px}
.code{background:var(--soft);border-radius:14px;padding:12px;font-size:12px;line-height:1.8;max-height:120px;overflow:auto;color:var(--muted);white-space:pre-wrap}
.slotrow{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;align-items:center;padding:10px;margin-bottom:10px;background:var(--card);border-radius:18px}.slotrow select{grid-column:1/3}.slotrow .rm{grid-column:1/-1}
.slotrow select,.slotrow input{min-height:46px;padding:0 8px;font-size:15px}
.apop{position:absolute;top:calc(76px + env(safe-area-inset-top));left:14px;right:14px;z-index:15;background:var(--card);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.25);overflow:hidden;transition:transform .45s cubic-bezier(.5,0,.2,1),opacity .45s;animation:apin .32s var(--ease)}
@keyframes apin{from{transform:translateY(-20px);opacity:0}}
.apop .in2{display:flex;gap:12px;padding:14px;border-right:5px solid var(--lv)}
.apop .ic{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--lv) 14%,transparent);color:var(--lv);display:grid;place-items:center;font-weight:900;flex:none}
.apop p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.apop .tb{height:4px;background:var(--soft)}.apop .tb i{display:block;height:100%;background:var(--lv);margin-left:auto;width:100%}
.tour{position:absolute;inset:0;z-index:30}
.spot{position:absolute;border-radius:18px;box-shadow:0 0 0 2000px rgba(4,10,7,.68);transition:all .32s var(--ease);pointer-events:none}
.tcardx{position:absolute;left:16px;right:16px;background:var(--card);border-radius:22px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);transition:top .32s var(--ease)}
.tcardx h4{margin:0 0 6px;font-size:18px}.tcardx p{margin:0;font-size:14px;line-height:1.8;color:var(--muted)}
.tfoot{display:flex;align-items:center;gap:8px;margin-top:14px}
.tdots{display:flex;gap:5px;flex:1}.tdots i{width:7px;height:7px;border-radius:4px;background:var(--line)}.tdots i.on{width:18px;background:var(--green)}
.sbtn{min-height:44px;padding:0 16px;border-radius:14px;font-weight:800;font-size:14px}.sbtn.g{background:var(--green);color:#04210F}.sbtn.s{background:var(--soft)}
.toast{position:absolute;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 40px);text-align:center;line-height:1.7;background:var(--nav);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;z-index:40;animation:apin .25s var(--ease)}
.motif{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app">
  <section class="screen" id="s-today"></section>
  <section class="screen" id="s-plan" hidden></section>
  <section class="screen" id="s-courses" hidden></section>
  <section class="screen" id="s-course" hidden></section>
  <nav class="nav" id="nav"></nav>
  <button class="fab press" id="fab" hidden onclick="courseSheet()"><span style="font-size:20px">+</span> درس جدید</button>
  <div class="cta" id="cta" hidden></div>
  <div class="scrim" id="scrim" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<script>
// ================= Jalali + dates =================
function div(a,b){return ~~(a/b)}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+div(jy,33)*8+div((jy%33)+3,4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*div(days,146097);days%=146097;if(days>36524){gy+=100*div(--days,36524);days%=36524;if(days>=365)days++}gy+=4*div(days,1461);days%=1461;if(days>365){gy+=div(days-1,365);days=(days-1)%365}let gd=days+1;const sal=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;for(;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd]}
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];let gy2=gm>2?gy+1:gy;let days=355666+365*gy+div(gy2+3,4)-div(gy2+99,100)+div(gy2+399,400)+gd+g[gm-1];let jy=-1595+33*div(days,12053);days%=12053;jy+=4*div(days,1461);days%=1461;if(days>365){jy+=div(days-1,365);days=(days-1)%365}const jm=days<186?1+div(days,31):7+div(days-186,30);const jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'],DS=['ش','ی','د','س','چ','پ','ج'];
const fa=n=>String(n??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const p2=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const dOf=iso=>{const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const TODAY=()=>isoOf(today());
const pday=d=>(d.getDay()+1)%7;
const jOf=iso=>{const[y,m,d]=iso.split('-').map(Number);return g2j(y,m,d)};
const isoJ=(jy,jm,jd)=>{const[g,m,d]=j2g(jy,jm,jd);return g+'-'+p2(m)+'-'+p2(d)};
function jLabel(iso,withDay,withYear){if(!iso)return'بدون تاریخ';const[y,m,d]=jOf(iso);return(withDay?DAYS[pday(dOf(iso))]+' ':'')+fa(d)+' '+MONTHS[m-1]+(withYear?' '+fa(y):'')}
function daysLeft(iso){if(!iso)return null;return Math.round((dOf(iso)-today())/864e5)}
function rel(iso){if(!iso)return'بدون مهلت';const d=daysLeft(iso);if(d===0)return'امروز';if(d===1)return'فردا';if(d===-1)return'دیروز';if(d>1&&d<7)return DAYS[pday(dOf(iso))];return jLabel(iso)}
const mlen=(jy,jm)=>jm<=6?31:jm<=11?30:Math.round((dOf(isoJ(jy+1,1,1))-dOf(isoJ(jy,12,1)))/864e5);
const hm=t=>{const[h,m]=(t||'00:00').split(':').map(Number);return h*60+(m||0)};

// ================= Data =================
const KEYS=['courses','exams','slots','sessions','tasks','offdays','meta'];
const COLORS=['#8B5CF6','#06B6D4','#14B8A6','#3B82F6','#EC4899','#84CC16','#FB923C','#16A34A','#EF4444','#64748B','#A855F7','#0EA5E9','#F43F5E','#D97706','#0D9488'];
const EXAM_TYPES=['میان‌ترم','پایان‌ترم','کوییز','پروژه','دیگر'];
const PHONE=!!window.Android,WEB=!PHONE&&!!window.DARSYAR_WEB;
const VERSION='5.0';
let S={},FILES={},sheetOpen=false;
const NOW=()=>Date.now();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SAFEID=/^[A-Za-z0-9_.\-]{1,80}$/;
const safeColor=c=>/^#[0-9a-fA-F]{6}$/.test(c||'')?c:'#16A34A';
function norm(s){s=s&&typeof s==='object'?s:{};KEYS.forEach(k=>{s[k]=Array.isArray(s[k])?s[k].filter(r=>r&&typeof r==='object'&&SAFEID.test(String(r.id))&&(!r.courseId||SAFEID.test(String(r.courseId)))):[]});
  s.courses.forEach(c=>{c.color=safeColor(c.color);c.topics=Array.isArray(c.topics)?c.topics.filter(t=>t&&SAFEID.test(String(t.id||'x'))).map(t=>({id:t.id||uid(),title:String(t.title||''),done:!!t.done})):[]});
  s.slots.forEach(x=>{x.day=Math.max(0,Math.min(6,+x.day||0))});return s}
function merge(a,b){const o={};KEYS.forEach(k=>{const m=new Map();[...(a[k]||[]),...(b[k]||[])].forEach(r=>{if(!r||!r.id)return;const x=m.get(r.id);if(!x||(+r.u||0)>(+x.u||0))m.set(r.id,r)});o[k]=[...m.values()]});return o}
const live=k=>S[k].filter(r=>!r.del&&!(k==='courses'&&r.archived));
const get=(k,id)=>S[k].find(r=>r.id===id&&!r.del&&!(k==='courses'&&r.archived));
const course=id=>get('courses',id);
const ofC=(k,cid)=>live(k).filter(r=>r.courseId===cid);
function put(k,r){r.u=NOW();if(k==='courses')r.color=safeColor(r.color);if(!r.id)r.id=uid();const i=S[k].findIndex(x=>x.id===r.id);if(i<0)S[k].push(r);else S[k][i]=r;return r}
function del(k,id){const r=S[k].find(x=>x.id===id);if(r){r.del=true;r.u=NOW()}}
function settings(){let s=S.meta.find(r=>r.id==='settings');if(!s){const[jy,jm]=jOf(TODAY());const ts=jm>=7&&jm<11?isoJ(jy,7,1):jm>=11?isoJ(jy,11,15):jm<=3?isoJ(jy-1,11,15):isoJ(jy,4,1);s={id:'settings',termStart:ts,notifyHour:21,u:0};S.meta.push(s)}return s}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;$('#app').appendChild(t);setTimeout(()=>t.remove(),2200)}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// ================= Schedule logic =================
function cancelled(iso,cid){return live('offdays').some(o=>o.date===iso&&(!o.courseId||o.courseId===cid))}
const holiday=iso=>live('offdays').some(o=>o.date===iso&&!o.courseId);
function classesOn(iso,cid){const pd=pday(dOf(iso));return live('slots').filter(s=>+s.day===pd&&course(s.courseId)&&(!cid||s.courseId===cid)).sort((a,b)=>hm(a.start)-hm(b.start)).map(s=>({slot:s,c:course(s.courseId),iso,off:cancelled(iso,s.courseId)}))}
function nextClass(cid){const n=new Date(),nm=n.getHours()*60+n.getMinutes();for(let i=0;i<21;i++){const iso=isoOf(addD(today(),i));const l=classesOn(iso,cid).filter(x=>!x.off&&(i>0||hm(x.slot.end||x.slot.start)>nm));if(l.length)return l[0]}return null}
function countdown(x){const d=daysLeft(x.iso);if(d===0){const mins=hm(x.slot.start)-(new Date().getHours()*60+new Date().getMinutes());if(mins<=0)return'الان در کلاس';if(mins<60)return fa(mins)+' دقیقه دیگه';return fa(Math.round(mins/60))+' ساعت دیگه'}if(d===1){const h=Math.round((24*60-(new Date().getHours()*60+new Date().getMinutes())+hm(x.slot.start))/60);return fa(h)+' ساعت دیگه'}return fa(d)+' روز دیگه'}
function occurrences(cid){const st=dOf(settings().termStart),end=addD(today(),14),out=[];let n=0;for(let d=st,g=0;d<=end&&g<300;d=addD(d,1),g++){const iso=isoOf(d);classesOn(iso,cid).forEach(x=>{if(!x.off)n++;out.push({...x,n:x.off?null:n,key:'s_'+cid+'_'+iso+'_'+x.slot.id})})}return out}
const sessionRec=key=>get('sessions',key);
const absCount=cid=>ofC('sessions',cid).filter(s=>s.absent).length;
const examsOf=cid=>ofC('exams',cid).sort((a,b)=>a.date<b.date?-1:1);
const nextExam=cid=>examsOf(cid).find(e=>daysLeft(e.date)>=0);
const openTasks=cid=>live('tasks').filter(t=>!t.done&&(!cid||t.courseId===cid));
const byDue=(a,b)=>(a.due||'9999')<(b.due||'9999')?-1:1;
const mastery=c=>c.topics&&c.topics.length?Math.round(100*c.topics.filter(t=>t.done).length/c.topics.length):(+c.mastery||0);
function examClashes(){const m={};live('exams').filter(e=>course(e.courseId)&&daysLeft(e.date)>=0).forEach(e=>(m[e.date]=m[e.date]||[]).push(e));return Object.entries(m).filter(([,l])=>l.length>1).sort()}
function semesterOver(){const ex=live('exams').filter(e=>course(e.courseId));return ex.length>0&&ex.every(e=>daysLeft(e.date)<0)}
function suggestions(){const out=[],clash=new Set(examClashes().flatMap(([,l])=>l.map(e=>e.courseId)));
  live('courses').forEach(c=>{const ex=nextExam(c.id);if(!ex)return;const d=daysLeft(ex.date),m=mastery(c),lf=(c.topics||[]).filter(t=>!t.done).length,cl=clash.has(c.id);
    const score=(100-m)*(cl?1.3:1)/Math.max(1,d),tail=(lf?' '+fa(lf)+' سرفصل مونده.':''),dd=d===0?'امروز':fa(d)+' روز';
    if(d<=3&&m<70)out.push({c,score:score+1000,t:`فقط ${dd} تا ${ex.type} و تسلطت ${fa(m)}٪ه. امروز اولویت با این درسه.${tail}`});
    else if(d<=14&&m<60)out.push({c,score:score+100,t:`${dd} تا ${ex.type}، تسلط ${fa(m)}٪. هر روز یه کم روش کار کن.${tail}`});
    else if(m<50)out.push({c,score,t:`تسلطت ${fa(m)}٪ه و ${dd} تا امتحان مونده؛ از همین هفته روزی یه کم بخون.${tail}`});
    else if(cl&&m<80)out.push({c,score,t:`امتحانش با یه درس دیگه هم‌روزه؛ زودتر جمعش کن.`})});
  return out.sort((a,b)=>b.score-a.score)}

// ================= Persistence =================
function persist(){LS.set('darsyar2',JSON.stringify(S));LS.set('darsyar_files',JSON.stringify(FILES))}
let alertT;function save(){persist();if(PHONE)scheduleNotifs();clearTimeout(alertT);alertT=setTimeout(checkAlerts,900)}
function load(){let s=null;try{s=JSON.parse(LS.get('darsyar2','null'))}catch(e){}
  try{FILES=JSON.parse(LS.get('darsyar_files','{}'))||{}}catch(e){FILES={}}
  if(!s){s={};let old=null;try{old=JSON.parse(LS.get('darsyar','null'))}catch(e){}
    if(old&&Array.isArray(old.courses)){s=norm({});old.courses.forEach(c=>{if(!SAFEID.test(String(c.id)))return;if(c.files&&c.files.length)FILES[c.id]=c.files.map(f=>({...f,group:''}));
      s.courses.push({id:c.id,u:NOW(),name:c.name,color:c.color,mastery:c.mastery||0,maxAbs:3,note:c.note||'',prof:'',units:'',topics:(c.topics||[]).map(t=>({id:uid(),...t}))});
      if(c.exam)s.exams.push({id:uid(),u:NOW(),courseId:c.id,type:'پایان‌ترم',date:c.exam,time:c.time||'',place:c.place||''})})}}
  S=norm(s);persist()}

// ================= Notifications (Android) =================
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2000000000}
function scheduleNotifs(){if(!PHONE||!Android.schedule)return;const out=[],now=NOW(),H=+settings().notifyHour;if(!H){Android.schedule('[]');return}
  for(let i=0;i<=30;i++){const d=addD(today(),i),iso=isoOf(d),lines=[];
    const cl=classesOn(iso).filter(x=>!x.off);cl.forEach(x=>{const tk=openTasks(x.slot.courseId).filter(t=>t.due===iso);lines.push('🕗 '+fa(x.slot.start)+' '+x.c.name+(x.slot.room?' — '+x.slot.room:'')+(tk.length?' • تحویل: '+tk.map(t=>t.title).join('، '):''))});
    live('exams').filter(e=>e.date===iso&&course(e.courseId)).forEach(e=>lines.push('📝 امتحان '+e.type+' '+course(e.courseId).name+(e.time?' ساعت '+fa(e.time):'')+(e.place?' — '+e.place:'')));
    openTasks().filter(t=>t.due===iso&&!cl.some(x=>x.slot.courseId===t.courseId)).forEach(t=>lines.push('✅ تحویل: '+t.title+(course(t.courseId)?' ('+course(t.courseId).name+')':'')));
    if(lines.length){const at=addD(d,-1).getTime()+H*3600e3;if(at>now)out.push({id:hash('n'+iso),at,title:'فردا، '+jLabel(iso,true)+(cl.length?' • '+fa(cl.length)+' کلاس':''),text:lines.join('\n')})}
    live('exams').filter(e=>e.date===iso&&course(e.courseId)).forEach(e=>{const at=addD(d,-3).getTime()+20*3600e3;if(at>now)out.push({id:hash('e3'+e.id+iso),at,title:'۳ روز تا امتحان '+course(e.courseId).name,text:e.type+' • '+jLabel(iso,true)+(e.time?' ساعت '+fa(e.time):'')})})}
  Android.schedule(JSON.stringify(out.slice(0,80)))}

// ================= Course icons =================
const KW=[['br',['برنامه','کامپایلر','الگوریتم','ساختمان داده','ساختمان‌داده','نرم‌افزار','نرم افزار','کامپیوتر','سیستم عامل','سیستم‌عامل','پایتون','جاوا']],['sine',['سیگنال','مخابرات','کنترل','پردازش']],
 ['bell',['آمار','احتمال']],['field',['فیزیک','الکترومغناطیس','میدان']],['circuit',['مدار','الکترونیک','منطقی','معماری','ریزپردازنده']],['graph',['شبکه','پایگاه','اطلاعات','گسسته','هوش','داده']],
 ['int',['ریاضی','معادلات','محاسبات','جبر','آنالیز']],['mol',['شیمی','زیست','بیولوژی']],['book',['اندیشه','معارف','اخلاق','تاریخ','انقلاب','ادبیات','فارسی','تفسیر','قرآن','وصیت','خانواده']],
 ['lang',['زبان','انگلیسی']],['chart',['اقتصاد','مدیریت','حسابداری','کارآفرینی','مالی']],['gear',['مکانیک','استاتیک','دینامیک','ماشین','ساخت','کارگاه']],['ball',['تربیت','ورزش']]];
const ICONS=['br','sine','bell','field','circuit','graph','int','mol','book','lang','chart','gear','ball','hash'];
const autoIcon=name=>{const n=String(name||'').replace(/ي/g,'ی').replace(/ك/g,'ک');for(const[k,ws] of KW)if(ws.some(w=>n.includes(w)))return k;return 'hash'};
const iconOf=c=>ICONS.includes(c.icon)?c.icon:autoIcon(c.name);
function hashStr(s){let h=7;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return h}
function motif(t,seed){let d='';
 if(t==='br')d='<path d="M28 8 Q18 8 18 20 V29 Q18 35 11 35 Q18 35 18 41 V50 Q18 62 28 62"/><path d="M50 18 L37 35 L50 52"/><path d="M70 18 L83 35 L70 52"/><path d="M92 8 Q102 8 102 20 V29 Q102 35 109 35 Q102 35 102 41 V50 Q102 62 92 62"/>';
 else if(t==='sine'){let p='M4 35';for(let x=4;x<=116;x+=3)p+=` L${x} ${(35-22*Math.sin((x-4)/112*Math.PI*3)).toFixed(1)}`;d=`<path d="${p}"/>`}
 else if(t==='int'){for(let x=10;x<=110;x+=20)d+=`<path d="M${x} 6 V64" opacity=".35"/>`;d+='<path d="M70 8 C60 6 63 22 60 35 C57 48 60 64 50 62"/>'}
 else if(t==='bell'){let p='M6 60';for(let x=6;x<=114;x+=3){const u=(x-60)/18;p+=` L${x} ${(60-50*Math.exp(-u*u/2)).toFixed(1)}`}d=`<path d="M6 60 H114" opacity=".4"/><path d="${p}"/>`}
 else if(t==='field'){d='<circle cx="24" cy="35" r="5"/><circle cx="96" cy="35" r="5"/>';[-26,-13,0,13,26].forEach(o=>d+=`<path d="M29 35 Q60 ${35+o*1.6} 91 35"/>`)}
 else if(t==='graph'){const N=[[14,18],[44,10],[40,44],[76,28],[104,50],[90,10],[66,60]];[[0,1],[0,2],[1,3],[2,3],[3,4],[3,5],[2,6],[6,4]].forEach(([a,b])=>d+=`<path d="M${N[a][0]} ${N[a][1]} L${N[b][0]} ${N[b][1]}"/>`);N.forEach(([x,y])=>d+=`<circle cx="${x}" cy="${y}" r="3.5"/>`)}
 else if(t==='circuit')d='<path d="M6 35 H30 L36 25 L44 45 L52 25 L60 45 L66 35 H80"/><path d="M80 22 V48 M88 22 V48"/><path d="M88 35 H114"/><circle cx="6" cy="35" r="3"/><circle cx="114" cy="35" r="3"/>';
 else if(t==='mol')d='<path d="M60 14 L79 25 V47 L60 58 L41 47 V25 Z"/><path d="M79 25 L100 14 M41 25 L20 14 M60 58 V68"/><circle cx="100" cy="14" r="5"/><circle cx="20" cy="14" r="5"/>';
 else if(t==='book')d='<path d="M60 18 C48 10 30 9 16 12 V58 C30 55 48 56 60 64 C72 56 90 55 104 58 V12 C90 9 72 10 60 18 Z"/><path d="M60 18 V64"/><path d="M26 24 H50 M26 34 H50 M70 24 H94 M70 34 H94" opacity=".5"/>';
 else if(t==='lang')d='<path d="M14 58 L30 12 L46 58 M20 42 H40"/><path d="M68 30 C68 22 92 20 92 32 V58 M92 44 C80 40 66 44 68 52 C70 60 88 58 92 50"/>';
 else if(t==='chart')d='<path d="M10 62 H110" opacity=".4"/><path d="M20 62 V44 M42 62 V34 M64 62 V40 M86 62 V22"/><path d="M14 40 L40 26 L62 32 L102 10"/>';
 else if(t==='gear'){let p='';for(let i=0;i<8;i++){const a=i/8*Math.PI*2,b=a+Math.PI/16;p+=`${i?'L':'M'}${(60+26*Math.cos(a)).toFixed(1)} ${(35+26*Math.sin(a)).toFixed(1)} L${(60+32*Math.cos(a+.1)).toFixed(1)} ${(35+32*Math.sin(a+.1)).toFixed(1)} L${(60+32*Math.cos(b+.15)).toFixed(1)} ${(35+32*Math.sin(b+.15)).toFixed(1)} L${(60+26*Math.cos(b+.25)).toFixed(1)} ${(35+26*Math.sin(b+.25)).toFixed(1)} `}d=`<path d="${p}Z"/><circle cx="60" cy="35" r="9"/>`}
 else if(t==='ball')d='<circle cx="60" cy="35" r="27"/><path d="M33 35 H87 M60 8 C46 20 46 50 60 62 M60 8 C74 20 74 50 60 62"/>';
 else{const h=hashStr(seed||'x');for(let i=0;i<4;i++){const x=16+((h>>(i*4))&15)*5.5,y=12+((h>>(i*4+16))&7)*6.5,r=6+((h>>(i*3))&7)*2.2;d+=(i%2?`<circle cx="${x}" cy="${y}" r="${r}"/>`:`<rect x="${x-r}" y="${y-r}" width="${r*2}" height="${r*2}" rx="4"/>`)}}

function openSheet(html){const sh=$('#sheet');sh.innerHTML='<div class="handle"></div>'+html;sh.scrollTop=0;sh.classList.add('on');$('#scrim').classList.add('on');sheetOpen=true}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');sheetOpen=false}
const pick=b=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on','bad'));b.classList.add('on')};
(()=>{const sh=$('#sheet');let y0=null,t0=0;
 sh.addEventListener('pointerdown',e=>{if(sh.scrollTop>0||e.target.closest('input,textarea,select,button,.mini'))return;y0=e.clientY;t0=Date.now()});
 sh.addEventListener('pointermove',e=>{if(y0==null)return;const d=Math.max(0,e.clientY-y0);sh.style.transition='none';sh.style.transform=`translateY(${d}px)`});
 const end=e=>{if(y0==null)return;const d=Math.max(0,e.clientY-y0),v=d/Math.max(1,Date.now()-t0);sh.style.transition='';sh.style.transform='';if(d>110||v>.5)closeSheet();y0=null};
 sh.addEventListener('pointerup',end);sh.addEventListener('pointercancel',end)})();

// --- date picker (Jalali mini month) ---
const DP={};
function datePicker(id,iso,allowNone){const t=iso||TODAY(),[y,m]=jOf(t);DP[id]={y,m,sel:iso||'',none:allowNone};return `<div id="${id}">${dpHTML(id)}</div>`}
function dpHTML(id){const s=DP[id],first=isoJ(s.y,s.m,1),pad=pday(dOf(first)),exd=new Set(live('exams').filter(e=>course(e.courseId)).map(e=>e.date));
  return `<div class="mini"><div class="mh"><button type="button" aria-label="ماه قبل" onclick="dpMove('${id}',-1)">→</button><b>${MONTHS[s.m-1]} ${fa(s.y)}</b><button type="button" aria-label="ماه بعد" onclick="dpMove('${id}',1)">←</button></div>${DS.map(x=>`<div class="h">${x}</div>`).join('')}${'<span></span>'.repeat(pad)}${Array.from({length:mlen(s.y,s.m)},(_,i)=>{const iso=isoJ(s.y,s.m,i+1);return `<button type="button" class="d ${iso===s.sel?'on':''} ${exd.has(iso)?'ex':''} ${iso===TODAY()?'td':''}" onclick="DP['${id}'].sel='${iso}';$('#${id}').innerHTML=dpHTML('${id}')">${fa(i+1)}</button>`}).join('')}</div>${s.none?`<button type="button" class="more" onclick="DP['${id}'].sel='';$('#${id}').innerHTML=dpHTML('${id}')">${s.sel?'پاک کردن تاریخ':'بدون تاریخ'}</button>`:''}`}
function dpMove(id,n){const s=DP[id];s.m+=n;if(s.m<1){s.m=12;s.y--}if(s.m>12){s.m=1;s.y++}$('#'+id).innerHTML=dpHTML(id)}

  autoPrev();if(!c)setTimeout(()=>$('#cn').focus(),250)}
function slotRow(s){s=s||{day:pday(today()),start:'10:00',end:'12:00',room:''};return `<div class="slotrow" data-id="${s.id||''}"><select class="in" aria-label="روز">${DAYS.map((d,i)=>`<option value="${i}" ${+s.day===i?'selected':''}>${d}</option>`).join('')}</select><button type="button" class="x" aria-label="حذف" onclick="this.parentNode.remove()">×</button><input class="in" type="time" aria-label="شروع" value="${esc(s.start)}"><input class="in" type="time" aria-label="پایان" value="${esc(s.end||'')}"><input class="in rm" aria-label="کلاس" placeholder="کلاس / ساختمان (اختیاری)" value="${esc(s.room||'')}"></div>`}
function moreCourse(c){c=c||{};const cur=CS.icon||'';
  return `<div class="two"><div><label for="cp">استاد</label><input class="in" id="cp" value="${esc(c.prof||'')}"></div><div><label for="cu">واحد</label><input class="in" id="cu" inputmode="numeric" value="${esc(c.units||'')}"></div></div>

function saveCourse(){const name=$('#cn').value.trim();if(!name){$('#cn').focus();return toast('اسم درس رو بنویس')}

function idb(){return new Promise((res,rej)=>{const q=indexedDB.open('darsyar',1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbOp(mode,fn){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('files',mode),s=t.objectStore('files'),q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
const idbPut=(k,v)=>idbOp('readwrite',s=>s.put(v,k)),idbGet=k=>idbOp('readonly',s=>s.get(k)),idbDel=k=>idbOp('readwrite',s=>s.delete(k));
function download(text,name,type){if(PHONE&&Android.saveText){Android.saveText(name,type,text);return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500)}

// ================= Calendar export + backup =================
function icsEsc(s){return String(s||'').replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n')}
const icsDT=(iso,t)=>iso.replace(/-/g,'')+'T'+(t||'00:00').replace(':','')+'00';
function exportICS(){const s=settings(),H=+s.notifyHour||21,L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Darsyar//FA','CALSCALE:GREGORIAN','X-WR-CALNAME:درس‌یار'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',exs=live('exams').filter(e=>course(e.courseId));
  const last=exs.map(e=>e.date).sort().pop()||isoOf(addD(dOf(s.termStart),140)),until=last.replace(/-/g,'')+'T235959';
  const alarm=(desc,trig)=>['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(desc),'TRIGGER:'+trig,'END:VALARM'];
  live('slots').forEach(sl=>{const c=course(sl.courseId);if(!c)return;let d=dOf(s.termStart);while(pday(d)!==+sl.day)d=addD(d,1);const first=isoOf(d);
    const ex=live('offdays').filter(o=>(!o.courseId||o.courseId===c.id)&&pday(dOf(o.date))===+sl.day&&o.date>=first).map(o=>icsDT(o.date,sl.start));
    L.push('BEGIN:VEVENT','UID:'+sl.id+'@darsyar','DTSTAMP:'+stamp,'DTSTART:'+icsDT(first,sl.start),'DTEND:'+icsDT(first,sl.end||sl.start),'RRULE:FREQ=WEEKLY;UNTIL='+until,...(ex.length?['EXDATE:'+ex.join(',')]:[]),
      'SUMMARY:'+icsEsc('کلاس '+c.name),'LOCATION:'+icsEsc(sl.room),'DESCRIPTION:'+icsEsc(c.prof?'استاد '+c.prof:''),...alarm('فردا کلاس '+c.name+(sl.room?' — '+sl.room:''),'-PT'+(hm(sl.start)+(24-H)*60)+'M'),'END:VEVENT')});
  exs.forEach(e=>{const c=course(e.courseId),t=e.time||'08:00',en=hm(t)+120;
    L.push('BEGIN:VEVENT','UID:'+e.id+'@darsyar','DTSTAMP:'+stamp,'DTSTART:'+icsDT(e.date,t),'DTEND:'+icsDT(e.date,p2(Math.min(23,Math.floor(en/60)))+':'+p2(en%60)),'SUMMARY:'+icsEsc('امتحان '+e.type+' '+c.name),'LOCATION:'+icsEsc(e.place),
      ...alarm('فردا امتحان '+c.name,'-PT'+(hm(t)+(24-H)*60)+'M'),...alarm('۳ روز تا امتحان '+c.name,'-P3D'),'END:VEVENT')});
  openTasks().filter(t=>t.due).forEach(t=>{const c=course(t.courseId);L.push('BEGIN:VEVENT','UID:'+t.id+'@darsyar','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+t.due.replace(/-/g,''),'SUMMARY:'+icsEsc('تحویل: '+t.title+(c?' ('+c.name+')':'')),...alarm('فردا تحویل: '+t.title,'-PT'+((24-H)*60)+'M'),'END:VEVENT')});
  L.push('END:VCALENDAR');download(L.join('\r\n'),'darsyar.ics','text/calendar');if(!PHONE)toast(isIOS()?'فایل رو باز کن و «Add All» رو بزن':'فایل رو باز کن تا به تقویم اضافه بشه')}

  <button class="btn ghost press" onclick="exportICS()">📅 افزودن کلاس‌ها و امتحان‌ها به تقویم گوشی</button><p class="sub" style="margin-top:6px">با هشدار شب قبل؛ برای آیفون هم کار می‌کنه.</p>
  <button class="btn ghost press" onclick="download(JSON.stringify({darsyarBackup:1,date:new Date().toISOString(),data:S}),'darsyar-backup-'+TODAY()+'.json','application/json');if(!PHONE)toast('ذخیره شد ✓')">⬇ دانلود فایل پشتیبان</button>
  <button class="btn ghost sm press" onclick="restoreBackup()">⬆ بازیابی از فایل</button><p class="sub" style="margin-top:6px">جزوه‌ها داخل فایل پشتیبان نیستن.</p>`)}
function restoreBackup(){if(PHONE){RESTORE=true;Android.pickText();return}const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>applyRestore(await i.files[0].text());i.click()}

// ================= AI import =================
const AI_PROMPT=`تو یک دستیار استخراج داده هستی. از تصویر «انتخاب واحد / برنامه‌ی کلاسی» که پیوست کرده‌ام، اطلاعات همه‌ی درس‌ها را استخراج کن و فقط و فقط یک فایل JSON با ساختار زیر بساز (اگر می‌توانی به‌صورت فایل قابل دانلود با نام darsyar-import.json بده، وگرنه داخل یک code block):

{
  "darsyar": 1,
  "courses": [
    {
      "name": "نام درس",
      "professor": "نام استاد",
      "units": 3,
      "classes": [
        { "day": "شنبه", "start": "08:00", "end": "10:30", "room": "" }
      ],
      "exams": [
        { "type": "پایان‌ترم", "date": "1405/10/20", "time": "10:45", "place": "" }
      ]
    }
  ]
}

قوانین:
- day فقط یکی از: شنبه، یکشنبه، دوشنبه، سه‌شنبه، چهارشنبه، پنجشنبه، جمعه
- ساعت‌ها ۲۴ساعته با فرمت HH:MM و با ارقام انگلیسی
- تاریخ امتحان شمسی با فرمت YYYY/MM/DD و ارقام انگلیسی؛ time = ساعت شروع امتحان
- اگر درسی چند جلسه در هفته دارد، برای هر جلسه یک آیتم در classes بگذار
- type امتحان یکی از: میان‌ترم، پایان‌ترم، کوییز، پروژه، دیگر (اگر مشخص نیست: پایان‌ترم)
- اگر اطلاعاتی در تصویر نیست، رشته‌ی خالی "" یا 0 بگذار؛ چیزی حدس نزن و درس اضافه نساز
- هیچ توضیح اضافه‌ای ننویس؛ فقط JSON`;
function copyPrompt(b){try{if(PHONE)Android.copy(AI_PROMPT);else navigator.clipboard.writeText(AI_PROMPT).catch(()=>{})}catch(e){}b.textContent='کپی شد ✓'}
function aiSheet(){openSheet(`<h3>✨ ورود کلاس‌ها با هوش مصنوعی</h3><p class="sub">۱. پرامپت رو کپی کن • ۲. همراه عکس انتخاب واحدت به یک هوش مصنوعی (Claude، ChatGPT، Gemini) بده • ۳. فایل یا متنی که بهت می‌ده رو اینجا وارد کن.</p>
  <div class="code">${esc(AI_PROMPT)}</div><button class="btn ghost sm press" onclick="copyPrompt(this)">📋 کپی پرامپت</button>
  <button class="btn ghost sm press" onclick="pickImport()">📂 انتخاب فایل جواب</button>
  <textarea class="in ltr" id="impt" style="margin-top:10px;font-size:13px" placeholder="…یا جواب رو اینجا paste کن"></textarea><button class="btn press" onclick="previewImport($('#impt').value)">بررسی</button><div id="impp"></div>`)}
function pickImport(){RESTORE=false;if(PHONE)Android.pickText();else{const i=document.createElement('input');i.type='file';i.accept='.json,.txt,application/json,text/plain';i.onchange=async()=>previewImport(await i.files[0].text());i.click()}}
window.onTextPicked=t=>{if(RESTORE){RESTORE=false;applyRestore(t);return}if($('#impt'))$('#impt').value=t;previewImport(t)};
const enD=s=>String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
const normDay=s=>{const k=String(s||'').replace(/[\s‌]/g,'').replace(/ي/g,'ی');return{'شنبه':0,'یکشنبه':1,'دوشنبه':2,'سهشنبه':3,'چهارشنبه':4,'پنجشنبه':5,'جمعه':6}[k]};
const normT=s=>{const m=enD(s).match(/(\d{1,2})[:٫.](\d{2})/);return m?p2(+m[1])+':'+m[2]:''};
function normJDate(s){const m=enD(s).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);if(!m)return'';const[y,mo,d]=[+m[1],+m[2],+m[3]];if(y<1300||y>1500||mo<1||mo>12||d<1||d>31)return'';return isoJ(y,mo,d)}
let IMP=null;
function previewImport(txt){const el=$('#impp');if(!el)return;try{const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<a)throw 0;const j=JSON.parse(txt.slice(a,b+1));if(!Array.isArray(j.courses)||!j.courses.length)throw 0;
    IMP=j.courses.filter(c=>c&&c.name).slice(0,40).map(c=>({name:String(c.name).trim().slice(0,80),prof:String(c.professor||c.prof||'').trim().slice(0,60),units:c.units?String(enD(c.units)).slice(0,3):'',
      classes:(Array.isArray(c.classes)?c.classes:[]).map(k=>({day:normDay(k.day),start:normT(k.start),end:normT(k.end),room:String(k.room||'').trim().slice(0,40)})).filter(k=>k.day!==undefined&&k.start),
      exams:(Array.isArray(c.exams)?c.exams:[]).map(e=>({type:EXAM_TYPES.includes(e.type)?e.type:'پایان‌ترم',date:normJDate(e.date),time:normT(e.time||e.start),place:String(e.place||'').trim().slice(0,40)})).filter(e=>e.date)}));
    if(!IMP.length)throw 0;const dates={};IMP.forEach(c=>c.exams.forEach(e=>(dates[e.date]=dates[e.date]||[]).push(c.name)));const cl=Object.entries(dates).filter(([,l])=>l.length>1);
    el.innerHTML=`<label>${fa(IMP.length)} درس پیدا شد</label><div class="list">${IMP.map(c=>`<div class="row"><span class="tx"><b>${esc(c.name)}</b><span class="m">${c.classes.map(k=>DAYS[k.day]+' '+fa(k.start)).join('، ')||'بدون زمان کلاس'}${c.exams.length?' • امتحان '+c.exams.map(e=>jLabel(e.date)).join('، '):''}</span></span>${live('courses').some(x=>x.name===c.name)?'<span class="end">به‌روزرسانی</span>':''}</div>`).join('')}</div>
     ${cl.map(([d,l])=>`<p class="sub" style="color:var(--bad);margin-top:8px">⚠ ${fa(l.length)} امتحان در ${jLabel(d)}: ${l.map(esc).join(' و ')}</p>`).join('')}<button class="btn press" onclick="doImport()">وارد کردن</button>`;el.scrollIntoView({behavior:'smooth'})}
  catch(e){IMP=null;el.innerHTML='<p class="sub" style="color:var(--bad);margin-top:10px">متن معتبر نیست. مطمئن شو جواب هوش مصنوعی همون JSON با ساختار پرامپته.</p>'}}
function doImport(){if(!IMP)return;let i=live('courses').length;IMP.forEach(x=>{let c=live('courses').find(c=>c.name===x.name);
    if(c){c.prof=x.prof||c.prof;c.units=x.units||c.units;put('courses',c);ofC('slots',c.id).forEach(r=>del('slots',r.id));ofC('exams',c.id).forEach(r=>del('exams',r.id))}
    else c=put('courses',{name:x.name,prof:x.prof,units:x.units,color:COLORS[i++%COLORS.length],maxAbs:3,mastery:0,topics:[],note:'',email:'',office:'',profNotes:''});
    x.classes.forEach(k=>put('slots',{courseId:c.id,...k}));x.exams.forEach(e=>put('exams',{courseId:c.id,...e}))});

function settingsSheet(){const s=settings(),th=LS.get('darsyar_theme','system'),H=+s.notifyHour;
  openSheet(`<h3>تنظیمات</h3><label>ظاهر</label><div class="seg">${[['light','روشن'],['dark','تیره'],['system','خودکار']].map(([v,l])=>`<button type="button" class="${th===v?'on':''}" onclick="pick(this);LS.set('darsyar_theme','${v}');applyTheme()">${l}</button>`).join('')}</div>
  ${PHONE?`<label>یادآوری شب قبل</label><div class="chips">${[[20,'۲۰:۰۰'],[21,'۲۱:۰۰'],[22,'۲۲:۰۰'],[23,'۲۳:۰۰'],[0,'خاموش']].map(([v,l])=>`<button type="button" class="${H===v?'on':''}" onclick="pick(this);const s=settings();s.notifyHour=${v};put('meta',s);save()">${l}</button>`).join('')}</div>`:''}
  <label for="nm">اسمت (برای سلام صفحه‌ی اول)</label><input class="in" id="nm" value="${esc(LS.get('darsyar_name',''))}" oninput="LS.set('darsyar_name',this.value.trim().slice(0,30))" enterkeyhint="done">
  <label>شروع ترم (برای شماره‌گذاری جلسه‌ها)</label>${datePicker('tsp',s.termStart,false)}
  <button class="btn press" onclick="const s=settings();s.termStart=DP.tsp.sel||s.termStart;put('meta',s);save();closeSheet();refresh();toast('ذخیره شد ✓')">ذخیره</button>
  <div id="nterm"><button class="btn danger sm press" onclick="newTermSheet()">شروع ترم جدید</button></div>`)}
function newTermSheet(){openSheet(`<h3>شروع ترم جدید</h3><p class="sub">درس‌های این ترم بایگانی می‌شن (پاک نمی‌شن) و می‌تونی کلاس‌های ترم بعد رو وارد کنی.</p><button class="btn danger press" onclick="newTerm()">بله، ترم جدید</button><button class="btn ghost sm press" onclick="closeSheet()">انصراف</button>`)}
function newTerm(){live('courses').forEach(c=>{c.archived=true;put('courses',c)});const s=settings();s.termStart=TODAY();put('meta',s);save();closeSheet();go('today');setTimeout(aiSheet,350)}
function openLink(u){if(PHONE&&Android.openUrl)Android.openUrl(u);else window.open(u,'_blank','noopener')}
function helpSheet(){openSheet(`<h3>راهنما و ارتباط با ما</h3><button class="btn ghost press" onclick="closeSheet();go('today');setTimeout(()=>tour(0),350)">🧭 دیدن دوباره‌ی راهنما</button>
  <p class="sub" style="margin-top:14px">درس‌یار رو ماهان کناررودی ساخته. پیشنهاد، باگ یا ایده داری؟ خوشحال می‌شم بشنوم.</p>
  <div class="list"><button class="row" onclick="openLink('mailto:mahankenarroudii@gmail.com')"><span class="tx"><b>ایمیل</b><span class="m ltr" style="display:block">mahankenarroudii@gmail.com</span></span><span class="end">‹</span></button><button class="row" onclick="openLink('https://github.com/mwhntich/darsyar')"><span class="tx"><b>GitHub</b><span class="m ltr" style="display:block">github.com/mwhntich/darsyar</span></span><span class="end">‹</span></button><button class="row" onclick="openLink('https://www.linkedin.com/search/results/people/?keywords=Mahan%20Kenarroudi')"><span class="tx"><b>LinkedIn</b><span class="m">Mahan Kenarroudi</span></span><span class="end">‹</span></button></div><p class="sub" style="text-align:center;margin-top:14px">نسخه ${fa(VERSION)}</p>`)}

// ================= Alerts =================
const LV={bad:'#E5484D',warn:'#E08A1E'};
function alerts(){const out=[];
  examClashes().forEach(([iso,l])=>out.push({id:'c_'+iso+'_'+l.map(e=>e.id).sort().join('.'),lv:'bad',t:fa(l.length)+' امتحان در یک روز',d:jLabel(iso,true)+': '+l.map(e=>esc(course(e.courseId).name)).join(' و ')+(daysLeft(iso)>0?' — از الان برای همه برنامه بریز.':''),go:`st.plan='month';st.calSel='${iso}';st.calM=null;go('plan')`}));
  live('courses').forEach(c=>{const ab=absCount(c.id),mx=+c.maxAbs||3;
    if(ab&&ab>=mx-1)out.push({id:'a_'+c.id+'_'+ab,lv:ab>=mx?'bad':'warn',t:'غیبت '+esc(c.name)+': '+fa(ab)+' از '+fa(mx),d:ab>=mx?'به سقف غیبت رسیدی!':'فقط یک غیبت دیگه جا داری.',go:`openCourse('${c.id}')`});
    const ex=nextExam(c.id);if(ex){const d=daysLeft(ex.date),m=mastery(c);if(d<=3&&m<70)out.push({id:'u_'+ex.id+'_'+d,lv:'warn',t:(d===0?'امروز':fa(d)+' روز تا')+' امتحان '+esc(c.name),d:'تسلطت '+fa(m)+'٪ه؛ وقت مرور جدیه.',go:`openCourse('${c.id}')`})}});
  const od=openTasks().filter(t=>t.due&&daysLeft(t.due)<0);if(od.length)out.push({id:'o_'+od.map(t=>t.id).sort().join('.'),lv:'warn',t:fa(od.length)+' کار عقب افتاده',d:od.slice(0,2).map(t=>esc(t.title)).join('، ')+(od.length>2?' و …':''),go:"go('today')"});
  return out}
function alertsSheet(){const al=alerts();markSeen(al);openSheet(`<h3>هشدارها</h3>${al.length?al.map(a=>`<button class="alertrow press" onclick="closeSheet();${a.go}"><div class="ic" style="background:color-mix(in srgb,${LV[a.lv]} 15%,transparent);color:${LV[a.lv]}">!</div><div><b>${a.t}</b><p>${a.d}</p></div></button>`).join(''):'<div class="empty">هشداری نداری ✓<br>همه‌چیز مرتبه.</div>'}`)}
function seenSet(){try{return new Set(JSON.parse(LS.get('darsyar_seen','[]')))}catch(e){return new Set()}}
function markSeen(al){const s=seenSet();al.forEach(a=>s.add(a.id));LS.set('darsyar_seen',JSON.stringify([...s].slice(-200)))}
let popEl=null,popT=null;
function checkAlerts(){if($('#tourov')||sheetOpen||popEl||st.cur)return;const al=alerts(),s=seenSet(),nw=al.filter(a=>!s.has(a.id));if(!nw.length)return;
  const a=nw[0];popEl=document.createElement('div');popEl.className='apop';popEl.style.setProperty('--lv',LV[a.lv]);
  popEl.innerHTML=`<div class="in2"><div class="ic">!</div><div style="flex:1;min-width:0"><b>${a.t}</b><p>${a.d}${nw.length>1?' • +'+fa(nw.length-1)+' هشدار دیگه':''}</p></div></div><div class="tb"><i></i></div>`;
  $('#app').appendChild(popEl);const bar=popEl.querySelector('.tb i');requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition='width 6s linear';bar.style.width='0%'}));
  popEl.onclick=()=>{clearTimeout(popT);markSeen(nw);popEl.remove();popEl=null;alertsSheet()};
  popT=setTimeout(()=>{markSeen(nw);const el=popEl;popEl=null;const b=$('#bellbtn');if(!b||!el)return el&&el.remove();const r1=el.getBoundingClientRect(),r2=b.getBoundingClientRect();el.style.transform=`translate(${r2.left+r2.width/2-(r1.left+r1.width/2)}px,${r2.top+r2.height/2-(r1.top+r1.height/2)}px) scale(.06)`;el.style.opacity='0';setTimeout(()=>el.remove(),470)},6000)}

// ================= Tour =================
const TOUR=[{t:'به درس‌یار خوش اومدی',d:'اسمت چیه؟ فقط برای سلام صفحه‌ی اول؛ روی گوشی خودت می‌مونه.',name:1},
 {el:'#nav',t:'سه بخش، همه‌چیز',d:'امروز: کلاس بعدی و کارها • برنامه: هفته، روز و ماه • درس‌ها: پنل کامل هر درس.'},
 {el:'#menubtn',t:'سریع‌ترین شروع',d:'از منو «ورود کلاس‌ها با هوش مصنوعی» رو بزن؛ با یک عکس از انتخاب واحدت، کل ترم ساخته می‌شه.'},
 {el:'#bellbtn',t:'هشدارها',d:'امتحان‌های هم‌روز، نزدیک شدن به سقف غیبت یا امتحانِ نزدیک اول یک لحظه نشون داده می‌شن، بعد اینجا می‌مونن.'}];
function tour(i){closeSheet();let ov=$('#tourov');if(!ov){ov=document.createElement('div');ov.className='tour';ov.id='tourov';ov.innerHTML='<div class="spot"></div><div class="tcardx"></div>';$('#app').appendChild(ov)}
  const s=TOUR[i],sp=ov.querySelector('.spot'),cd=ov.querySelector('.tcardx'),ap=$('#app').getBoundingClientRect(),el=s.el&&$(s.el),r=el&&el.getBoundingClientRect();
  if(r)Object.assign(sp.style,{left:r.left-ap.left-6+'px',top:r.top-ap.top-6+'px',width:r.width+12+'px',height:r.height+12+'px'});else Object.assign(sp.style,{left:'50%',top:'40%',width:'0px',height:'0px'});
  const last=i===TOUR.length-1;
  cd.innerHTML=`<h4>${s.t}</h4><p>${s.d}</p>${s.name?`<input class="in" id="tnm" style="margin-top:12px" placeholder="مثلاً سارا (اختیاری)" value="${esc(LS.get('darsyar_name',''))}" enterkeyhint="next">`:''}
   <div class="tfoot"><div class="tdots">${TOUR.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>${last?'':`<button class="sbtn s press" onclick="endTour()">رد کردن</button>`}<button class="sbtn g press" onclick="${s.name?"LS.set('darsyar_name',($('#tnm').value||'').trim().slice(0,30));todayS();":''}${last?'endTour()':`tour(${i+1})`}">${last?'شروع':'بعدی'}</button></div>`;
  const h=cd.offsetHeight,H=ap.height;const top=r?(r.top-ap.top>H/2?r.top-ap.top-h-20:r.bottom-ap.top+20):(H-h)/2;cd.style.top=Math.max(12,Math.min(H-h-12,top))+'px'}
function endTour(){const ov=$('#tourov');if(ov)ov.remove();LS.set('darsyar_tour','1');refresh();setTimeout(checkAlerts,700)}

// ================= Theme + boot =================
function applyTheme(){const t=LS.get('darsyar_theme','system');const dark=t==='dark'||(t==='system'&&(PHONE&&Android.isDark?Android.isDark():matchMedia('(prefers-color-scheme: dark)').matches));
  document.documentElement.dataset.theme=dark?'dark':'light';if(PHONE&&Android.bars)Android.bars(dark?'#0B0D0C':'#F4F6F3',!dark);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0B0D0C':'#F4F6F3'}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
window.onAppResume=()=>{applyTheme();if(!sheetOpen)refresh();setTimeout(checkAlerts,800)};
applyTheme();load();settings();go('today');if(PHONE)scheduleNotifs();
if(WEB){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
setTimeout(()=>{if(!LS.get('darsyar_tour',''))tour(0);else checkAlerts()},500);
setInterval(()=>{if(!sheetOpen&&!st.cur&&!$('#tourov')&&!['INPUT','TEXTAREA'].includes((document.activeElement||{}).tagName))refresh()},60000);
</script>
